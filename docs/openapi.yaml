openapi: 3.0.3
info:
  title: Feedback API
  version: 1.0.0
  description: |
    Бэкенд сервиса обращений (заявок) с чатом по каждой заявке.

    ## Окружение (docker compose)
    | Сервис | Адрес снаружи | Внутри docker-сети |
    |---|---|---|
    | Frontend | http://localhost:9000 | — |
    | Backend (этот API) | http://localhost:9100 | http://backend:3000 |
    | Keycloak | http://localhost:9200 | http://keycloak:8080 |
    | PostgreSQL | localhost:9300 | postgres:5432 |

    Backend должен разрешить CORS для origin `http://localhost:9000`
    (методы `GET, POST, PATCH, OPTIONS`, заголовки `Authorization, Content-Type`).

    ## Авторизация
    Аутентификация через **Keycloak**, realm `practics`, публичный клиент `frontend`
    (Authorization Code + PKCE). Фронтенд передаёт access-токен в заголовке
    `Authorization: Bearer <jwt>`. Бэкенд проверяет подпись токена и берёт из него:
    - `sub` — id пользователя (он же `authorId` заявок и сообщений);
    - `preferred_username` — имя пользователя (`authorName` сообщений);
    - роли из `realm_access.roles` — для администратора ожидается роль `admin`.

    **Проверка токена на бэкенде:**
    - ключи (JWKS) брать по внутреннему адресу:
      `http://keycloak:8080/realms/practics/protocol/openid-connect/certs`;
    - `iss` в токене будет **внешним**: `http://localhost:9200/realms/practics`
      (так настроен `KC_HOSTNAME`/`KC_HOSTNAME_PORT`), именно с ним нужно сверять `iss`;
    - `aud` у токенов клиента `frontend` может не содержать `backend` — проверять
      подпись, `iss` и срок действия.

    `authorId`, `authorName` и `isAdmin` **никогда не принимаются от клиента** —
    сервер всегда берёт их из токена.

    ## Правила доступа
    | Действие | Кто может |
    |---|---|
    | Смотреть список заявок, заявку, чат, скачивать файлы | любой, в том числе без токена |
    | Создавать заявку | любой авторизованный пользователь |
    | Писать в чат (текст и файлы) | **автор заявки** и **администратор** (в любой чат) |
    | Менять статус, модерировать | только администратор |

    ## Видимость заявок «На модерации»
    Заявка со статусом `На модерации` видна только своему автору и администратору.
    Для всех остальных она не попадает в списки, а `GET /applications/{id}`,
    сообщения и файлы такой заявки отвечают `404`.
    Это правило распространяется на всё, что относится к заявке (чат, файлы).

    ## Формат ошибок
    Все ошибки возвращаются в виде `ApiError`.
  contact:
    name: Frontend team

servers:
  - url: http://localhost:9100
    description: Backend в docker compose (контейнер `practics-backend`, внутри порт 3000)

tags:
  - name: Applications
    description: Заявки
  - name: Moderation
    description: Модерация заявок (только admin)
  - name: Chat
    description: Чат заявки
  - name: Files
    description: Вложения чата

paths:
  /applications:
    get:
      tags: [Applications]
      operationId: listApplications
      summary: Список заявок
      description: |
        Возвращает заявки от новых к старым (по `date`, по убыванию).

        - Без параметра `status` заявки со статусом `На модерации` в список **не попадают**.
        - `mine=true` возвращает заявки текущего пользователя **включая** `На модерации`
          (используется на странице аккаунта). Требует токен.
        - `status=На модерации` без `mine` доступен только администратору (очередь модерации).
      security:
        - {}
        - keycloak: []
      parameters:
        - name: status
          in: query
          description: Фильтр по статусу
          schema:
            $ref: '#/components/schemas/ApplicationStatus'
        - name: search
          in: query
          description: Поиск по подстроке в `title`, без учёта регистра
          schema:
            type: string
        - name: mine
          in: query
          description: Только заявки текущего пользователя
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Список заявок
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Applications]
      operationId: createApplication
      summary: Создать заявку
      description: |
        Создаёт заявку со статусом `На модерации`. `authorId` берётся из токена,
        `date` ставится сервером.
      security:
        - keycloak: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
            example:
              title: Не приходит код подтверждения
              project: 1X
      responses:
        '201':
          description: Заявка создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /applications/{id}:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    get:
      tags: [Applications]
      operationId: getApplication
      summary: Получить заявку по id
      description: |
        Заявка `На модерации` возвращается только автору и администратору,
        остальным — `404`.
      security:
        - {}
        - keycloak: []
      responses:
        '200':
          description: Заявка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '404':
          $ref: '#/components/responses/NotFound'

  /applications/{id}/status:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    patch:
      tags: [Moderation]
      operationId: updateApplicationStatus
      summary: Изменить статус заявки
      description: Только администратор. Можно выставить любой статус из `ApplicationStatus`.
      security:
        - keycloak: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApplicationStatusRequest'
            example:
              status: В обработке
      responses:
        '200':
          description: Обновлённая заявка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /applications/{id}/moderation:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    post:
      tags: [Moderation]
      operationId: moderateApplication
      summary: Принять решение по заявке на модерации
      description: |
        Только администратор. Работает только для заявки со статусом `На модерации`,
        иначе `409`.

        - `approve` → статус становится `Новые`;
        - `reject` → статус становится `Отклоненные`.

        `comment` (необязательно) сохраняется вместе с решением.
        Текущий фронтенд его не отправляет и не показывает.
      security:
        - keycloak: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationDecisionRequest'
            example:
              decision: approve
      responses:
        '200':
          description: Заявка с новым статусом
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Заявка уже не находится на модерации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /applications/{id}/messages:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    get:
      tags: [Chat]
      operationId: listMessages
      summary: Сообщения чата заявки
      description: |
        Читать чат может любой (с учётом правила видимости заявок `На модерации`).
        Сообщения отсортированы по `createdAt` по возрастанию.

        Для обновления чата фронтенд может опрашивать эндпоинт с параметром `after` —
        тогда возвращаются только более новые сообщения.
      security:
        - {}
        - keycloak: []
      parameters:
        - name: after
          in: query
          description: Вернуть только сообщения с `createdAt` строго позже указанного момента
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Сообщения
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags: [Chat]
      operationId: createMessage
      summary: Отправить сообщение (с файлом или без)
      description: |
        Писать могут **только автор заявки и администратор**. Остальным — `403`.

        Запрос — `multipart/form-data`: текст и необязательный файл отправляются
        одним запросом, поэтому сообщение и вложение создаются атомарно.
        Должно быть передано хотя бы одно из полей `text` / `file`.

        Сервер сам заполняет `id`, `applicationId`, `authorId`, `authorName`,
        `isAdmin` (из токена) и `createdAt`.

        Ограничения: `text` — до 2000 символов, `file` — до 10 МБ (иначе `413`).
      security:
        - keycloak: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateMessageRequest'
      responses:
        '201':
          description: Сообщение создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: Файл больше 10 МБ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /files/{id}:
    get:
      tags: [Files]
      operationId: downloadFile
      summary: Скачать вложение
      description: |
        `id` — это `attachment.id` из сообщения. Доступ такой же, как к чату заявки,
        к которой относится файл (для заявки `На модерации` — только автор и админ).

        Рекомендации по безопасности: отдавать заголовок `X-Content-Type-Options: nosniff`;
        для типов, кроме `image/png`, `image/jpeg`, `image/gif`, `image/webp`,
        использовать `Content-Disposition: attachment`.
      security:
        - {}
        - keycloak: []
      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор вложения (`attachment.id`)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Содержимое файла
          headers:
            Content-Disposition:
              description: Имя файла (`attachment.name`)
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    keycloak:
      type: oauth2
      description: |
        Access-токен Keycloak (realm `practics`), передаётся как `Authorization: Bearer <jwt>`.
        Роль администратора — `admin` в `realm_access.roles`.
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:9200/realms/practics/protocol/openid-connect/auth
          tokenUrl: http://localhost:9200/realms/practics/protocol/openid-connect/token
          refreshUrl: http://localhost:9200/realms/practics/protocol/openid-connect/token
          scopes:
            openid: Базовый scope OpenID Connect

  parameters:
    ApplicationId:
      name: id
      in: path
      required: true
      description: Идентификатор заявки
      schema:
        type: string
        example: '1025'

  schemas:
    ApplicationStatus:
      type: string
      enum:
        - На модерации
        - Новые
        - В обработке
        - Завершенные
        - Отклоненные

    Project:
      type: string
      enum: [1X, Music, Delivery]

    Application:
      type: object
      required: [id, title, date, project, status, authorId]
      properties:
        id:
          type: string
          example: '1025'
        title:
          type: string
          description: Описание проблемы
          example: Не приходит код подтверждения
        date:
          type: string
          format: date-time
          description: Дата создания (ставится сервером)
        project:
          $ref: '#/components/schemas/Project'
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        authorId:
          type: string
          description: Id пользователя Keycloak (`sub`), создавшего заявку

    ApplicationsResponse:
      type: array
      items:
        $ref: '#/components/schemas/Application'

    CreateApplicationRequest:
      type: object
      required: [title, project]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 1000
        project:
          $ref: '#/components/schemas/Project'

    UpdateApplicationStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/ApplicationStatus'

    ModerationDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        comment:
          type: string
          maxLength: 1000

    ChatAttachment:
      type: object
      description: Метаданные вложения; сам файл скачивается через `GET /files/{id}`
      required: [id, name, size, type]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Исходное имя файла
          example: error.png
        size:
          type: integer
          description: Размер в байтах
          example: 184320
        type:
          type: string
          description: MIME-тип
          example: image/png

    ChatMessage:
      type: object
      required: [id, applicationId, authorId, authorName, text, createdAt]
      properties:
        id:
          type: string
          format: uuid
        applicationId:
          type: string
          example: '1025'
        authorId:
          type: string
          description: Id пользователя Keycloak (`sub`)
        authorName:
          type: string
          description: Имя пользователя (`preferred_username`) на момент отправки
        isAdmin:
          type: boolean
          description: Сообщение написано администратором (в интерфейсе подписывается «Поддержка»)
        text:
          type: string
          maxLength: 2000
          description: Текст; может быть пустой строкой, если приложен файл
        attachment:
          $ref: '#/components/schemas/ChatAttachment'
        createdAt:
          type: string
          format: date-time

    CreateMessageRequest:
      type: object
      description: Нужно передать `text`, `file` или оба поля
      anyOf:
        - required: [text]
        - required: [file]
      properties:
        text:
          type: string
          maxLength: 2000
        file:
          type: string
          format: binary
          description: Файл до 10 МБ

    ApiError:
      type: object
      required: [statusCode, message]
      properties:
        statusCode:
          type: integer
          example: 400
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        error:
          type: string
          example: Bad Request

  responses:
    BadRequest:
      description: Некорректный запрос (ошибка валидации)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Нет токена или он недействителен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Недостаточно прав
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Не найдено (в том числе заявка на модерации, скрытая от текущего пользователя)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
