services:
  postgres:
    image: postgres:16-alpine
    container_name: practics-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: practics
    ports:
      - "9300:5432"
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - practics

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: practics-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/practics
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: 123456
      KC_DB_SCHEMA: keycloak
    ports:
      - "9200:8080"
    volumes:
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    depends_on:
      - postgres
    networks:
      - practics

networks:
  practics:
    driver: bridge